# みんやせ / codemagic.yaml
#
# iOS App Store build
#
# Bundle ID: com.minyase.app
# Apple ID: 6808256800
# App Store Version: 1.0.1
# iPhone専用
#
# 2026-09-08
# ・Node / npm 固定
# ・Xcode固定
# ・Capacitor依存をpackage.jsonで固定
# ・package-lock.jsonがあればnpm ci
# ・lockfile未作成時は生成後npm ci
# ・operator-ui.js をビルド対象として検証
# ・App Store / TestFlightへの自動提出は行わない

workflows:

  ios-minyase:

    name: MINYASE iOS

    max_build_duration: 60

    instance_type: mac_mini_m2


    integrations:

      app_store_connect: Codemagic


    environment:

      node: 20.20.2

      npm: 10.8.2

      xcode: 26.6

      cocoapods: 1.16.2


      ios_signing:

        distribution_type: app_store

        bundle_identifier: com.minyase.app


      vars:

        XCODE_WORKSPACE: "ios/App/App.xcworkspace"

        XCODE_SCHEME: "App"

        APP_STORE_APPLE_ID: 6808256800

        APP_VERSION: "1.0.1"


    scripts:


      - name: ビルド環境を確認する

        script: |

          set -e

          echo "===== Build environment ====="

          echo "Node:"
          node --version

          echo "npm:"
          npm --version

          echo "Xcode:"
          xcodebuild -version

          echo "CocoaPods:"
          pod --version


          NODE_ACTUAL="$(node --version)"

          NPM_ACTUAL="$(npm --version)"


          if [ "$NODE_ACTUAL" != "v20.20.2" ]; then

            echo "ERROR: Node.js が v20.20.2 ではありません"

            exit 1

          fi


          if [ "$NPM_ACTUAL" != "10.8.2" ]; then

            echo "ERROR: npm が 10.8.2 ではありません"

            exit 1

          fi


          XCODE_ACTUAL="$(

            xcodebuild -version |

            head -n 1 |

            awk '{print $2}'

          )"


          case "$XCODE_ACTUAL" in

            26.6*)

              echo "OK: Xcode $XCODE_ACTUAL"

              ;;

            *)

              echo "ERROR: Xcode 26.6 系ではありません: $XCODE_ACTUAL"

              exit 1

              ;;

          esac


      - name: 依存の取得

        script: |

          set -e


          echo "===== package.json ====="

          cat package.json


          if [ -f "package-lock.json" ]; then

            echo "package-lock.json found"

            npm ci

          else

            echo "package-lock.json がまだ無いため生成します"

            npm install \
              --package-lock-only \
              --ignore-scripts


            if [ ! -f "package-lock.json" ]; then

              echo "ERROR: package-lock.json の生成に失敗しました"

              exit 1

            fi


            echo "package-lock.json generated"

            npm ci

          fi


          echo "===== Installed top-level packages ====="

          npm ls \
            @capacitor/core \
            @capacitor/ios \
            @capacitor/local-notifications \
            @capacitor/cli \
            @capacitor/assets \
            web-push \
            --depth=0


      - name: 依存バージョンを検証する

        script: |

          set -e


          node <<'NODE'

          const fs =
            require('fs');


          const pkg =
            JSON.parse(
              fs.readFileSync(
                'package.json',
                'utf8'
              )
            );


          const expected = {

            dependencies: {

              '@capacitor/core':
                '7.6.9',

              '@capacitor/ios':
                '7.6.9',

              '@capacitor/local-notifications':
                '7.0.7',

              'web-push':
                '3.6.7'

            },

            devDependencies: {

              '@capacitor/assets':
                '3.0.5',

              '@capacitor/cli':
                '7.6.9'

            }

          };


          for (
            const [
              section,
              values
            ] of Object.entries(
              expected
            )
          ) {

            for (
              const [
                name,
                version
              ] of Object.entries(
                values
              )
            ) {

              const actual =
                pkg[
                  section
                ] &&
                pkg[
                  section
                ][
                  name
                ];


              if (
                actual !==
                  version
              ) {

                throw new Error(
                  `${name}: expected ${version}, got ${actual}`
                );
              }


              console.log(
                `OK ${name} ${version}`
              );
            }
          }

          NODE


      - name: 配信するWebファイルを www に集める

        script: |

          set -e


          npm run build


          echo "===== www contents ====="

          ls -la www


          REQUIRED_FILES="

          index.html

          style.css

          app.js

          operator-ui.js

          leader.js

          tsuda-fx.js

          notify.js

          vote.js

          privacy.html

          terms.html

          support.html

          manifest.webmanifest

          sw.js

          "


          for f in $REQUIRED_FILES; do

            if [ ! -f "www/$f" ]; then

              echo "ERROR: www/$f がありません"

              exit 1

            fi

          done


          echo "OK: Web files verified"


      - name: iOSプロジェクトを用意する

        script: |

          set -e


          if [ ! -d "ios" ]; then

            echo "iOS project does not exist. Creating it."

            npx cap add ios

          else

            echo "Existing iOS project found."

          fi


      - name: App icon と Splash を生成する

        script: |

          set -e


          if [ ! -f "resources/icon.png" ]; then

            echo "ERROR: resources/icon.png がありません"

            exit 1

          fi


          echo "Generating iOS assets..."


          npx @capacitor/assets generate --ios


      - name: WebファイルをiOSへ同期する

        script: |

          set -e


          npx cap sync ios


      - name: Capacitor同期結果を確認する

        script: |

          set -e


          WWW_DIR="ios/App/App/public"


          if [ ! -d "$WWW_DIR" ]; then

            echo "ERROR: iOSのpublicディレクトリがありません"

            exit 1

          fi


          for f in \
            index.html \
            style.css \
            app.js \
            operator-ui.js \
            leader.js \
            notify.js \
            privacy.html \
            terms.html \
            support.html

          do

            if [ ! -f "$WWW_DIR/$f" ]; then

              echo "ERROR: $WWW_DIR/$f がありません"

              exit 1

            fi

          done


          echo "OK: Capacitor web assets verified"


      - name: iPhone専用に設定する

        script: |

          set -e


          PBXPROJ="ios/App/App.xcodeproj/project.pbxproj"


          if [ ! -f "$PBXPROJ" ]; then

            echo "ERROR: Xcode project が見つかりません"

            exit 1

          fi


          echo "===== Current TARGETED_DEVICE_FAMILY ====="

          grep -n \
            "TARGETED_DEVICE_FAMILY" \
            "$PBXPROJ" \
            || true


          python3 <<'PY'

          from pathlib import Path
          import re


          path = Path(
              "ios/App/App.xcodeproj/project.pbxproj"
          )


          text = path.read_text(
              encoding="utf-8"
          )


          pattern = (
              r'TARGETED_DEVICE_FAMILY'
              r'\s*=\s*'
              r'[^;]+;'
          )


          replacement = (
              'TARGETED_DEVICE_FAMILY = 1;'
          )


          new_text, count = re.subn(
              pattern,
              replacement,
              text
          )


          if count == 0:

              raise SystemExit(
                  "ERROR: TARGETED_DEVICE_FAMILY がありません"
              )


          path.write_text(
              new_text,
              encoding="utf-8"
          )


          values = re.findall(
              r'TARGETED_DEVICE_FAMILY'
              r'\s*=\s*'
              r'([^;]+);',
              new_text
          )


          values = [
              v.strip().strip('"')
              for v in values
          ]


          if (
              not values
              or any(
                  v != "1"
                  for v in values
              )
          ):

              raise SystemExit(
                  "ERROR: iPhone専用設定に失敗: "
                  + repr(values)
              )


          print(
              "TARGETED_DEVICE_FAMILY verified: "
              + repr(values)
          )

          PY


          ACTUAL=$(

            xcodebuild \
              -project ios/App/App.xcodeproj \
              -target App \
              -configuration Release \
              -showBuildSettings \
              2>/dev/null \
            | awk \
              -F ' = ' \
              '/TARGETED_DEVICE_FAMILY/ {
                print $2;
                exit
              }'

          )


          echo "TARGETED_DEVICE_FAMILY=$ACTUAL"


          if [ "$ACTUAL" != "1" ]; then

            echo "ERROR: Release build がiPhone専用ではありません"

            exit 1

          fi


          echo "OK: iPhone only"


      - name: iOS Privacy Usage Description を設定する

        script: |

          set -e


          PLIST="ios/App/App/Info.plist"


          if [ ! -f "$PLIST" ]; then

            echo "ERROR: Info.plist が見つかりません"

            exit 1

          fi


          /usr/libexec/PlistBuddy \
            -c "Set :NSPhotoLibraryUsageDescription プロフィール画像を設定するために写真ライブラリを使用します。" \
            "$PLIST" \
          || \
          /usr/libexec/PlistBuddy \
            -c "Add :NSPhotoLibraryUsageDescription string プロフィール画像を設定するために写真ライブラリを使用します。" \
            "$PLIST"


          /usr/libexec/PlistBuddy \
            -c "Set :NSCameraUsageDescription プロフィール画像を撮影するためにカメラを使用します。" \
            "$PLIST" \
          || \
          /usr/libexec/PlistBuddy \
            -c "Add :NSCameraUsageDescription string プロフィール画像を撮影するためにカメラを使用します。" \
            "$PLIST"


          echo "===== Info.plist validation ====="


          plutil -lint \
            "$PLIST"


      - name: CocoaPods

        script: |

          set -e


          cd ios/App


          pod install


          if [ ! -f "Podfile.lock" ]; then

            echo "ERROR: Podfile.lock が生成されませんでした"

            exit 1

          fi


          echo "===== Pod versions ====="

          grep \
            -E 'Capacitor|LocalNotifications' \
            Podfile.lock \
            || true


      - name: 署名設定をXcodeプロジェクトへ適用する

        script: |

          set -e


          xcode-project use-profiles


      - name: バージョンとビルド番号を設定する

        script: |

          set -e


          cd "$CM_BUILD_DIR/ios/App"


          PLIST="App/Info.plist"


          echo "===== App Version ====="


          echo "Setting App Store version to $APP_VERSION"


          agvtool \
            new-marketing-version \
            "$APP_VERSION"


          ACTUAL_VERSION=$(

            /usr/libexec/PlistBuddy \
              -c "Print :CFBundleShortVersionString" \
              "$PLIST"

          )


          echo "CFBundleShortVersionString=$ACTUAL_VERSION"


          if [ "$ACTUAL_VERSION" != "$APP_VERSION" ]; then

            echo "ERROR: App Version が $APP_VERSION になっていません"

            exit 1

          fi


          echo "OK: App Version $APP_VERSION"


          echo "===== Build Number ====="


          LATEST_BUILD_NUMBER=$(

            app-store-connect \
              get-latest-app-store-build-number \
              "$APP_STORE_APPLE_ID" \
            || true

          )


          echo "Latest App Store build number: ${LATEST_BUILD_NUMBER:-not-found}"


          if [ -z "$LATEST_BUILD_NUMBER" ]; then

            NEXT=$BUILD_NUMBER

          else

            NEXT=$((LATEST_BUILD_NUMBER + 1))

          fi


          echo "Next build number: $NEXT"


          agvtool \
            new-version \
            -all \
            "$NEXT"


          ACTUAL_BUILD=$(

            /usr/libexec/PlistBuddy \
              -c "Print :CFBundleVersion" \
              "$PLIST"

          )


          echo "CFBundleVersion=$ACTUAL_BUILD"


          if [ "$ACTUAL_BUILD" != "$NEXT" ]; then

            echo "ERROR: Build Number の設定に失敗しました"

            exit 1

          fi


          echo "OK: Version $APP_VERSION ($NEXT)"


      - name: IPAを作る

        script: |

          set -e


          cd "$CM_BUILD_DIR/ios/App"


          echo "Building みんやせ $APP_VERSION..."


          xcode-project build-ipa \
            --workspace "$CM_BUILD_DIR/$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"


    artifacts:

      - ios/App/build/ios/ipa/*.ipa

      - /tmp/xcodebuild_logs/*.log

      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app

      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

      - package-lock.json

      - ios/App/Podfile.lock
