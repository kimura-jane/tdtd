name = "tdtd"
main = "worker/entry.js"
compatibility_date = "2026-09-02"
workers_dev = true

# GitHub 連携のデプロイ（npx wrangler deploy）で
# ダッシュボード側の変数・シークレットが消えるのを防ぐ
keep_vars = true

[assets]
directory = "."
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "tdtd"
database_id = "01ace57a-e539-4f86-ad22-e04cd4b07971"

[[r2_buckets]]
binding = "ICONS"
bucket_name = "tdtd-icons"

[[ratelimits]]
name = "JOIN_LIMITER"
namespace_id = "1001"
  [ratelimits.simple]
  limit = 5
  period = 60
