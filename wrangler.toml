name = "tdtd"
main = "worker/root.js"
compatibility_date = "2026-09-02"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# GitHub 連携のデプロイ（npx wrangler deploy）で
# ダッシュボード側の変数・シークレットが消えるのを防ぐ
keep_vars = true

[observability]
enabled = true

  [observability.logs]
  invocation_logs = true
  head_sampling_rate = 1

[assets]
directory = "."
binding = "ASSETS"
run_worker_first = ["/.well-known/*"]

[triggers]
crons = [ "*/15 * * * *" ]

[[d1_databases]]
binding = "DB"
database_name = "tdtd"
database_id = "01ace57a-e539-4f86-ad22-e04cd4b07971"

[[r2_buckets]]
binding = "ICONS"
bucket_name = "tdtd-icons"

[[ratelimits]]
name = "JOIN_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 5
  period = 60
