# みんやせ / codemagic.yaml
#
# iOS App Store build
#
# 前提
#   - リポジトリ直下のWebファイルを www/ にコピーする
#   - Capacitor の webDir は www
#   - API は Cloudflare Workers
#   - Bundle ID: com.minyase.app
#   - Apple ID: 6808256800
#
# Codemagic UI 側に必要なもの
#   - App Store Connect API integration: Codemagic
#   - Distribution certificate
#   - App Store provisioning profile

workflows:

  ios-minyase:

    name: MINYASE iOS

    max_build_duration: 60

    instance_type: mac_mini_m2


    integrations:

      app_store_connect: Codemagic


    environment:

      node: 20

      xcode: latest

      cocoapods: default


      ios_signing:

        distribution_type: app_store

        bundle_identifier: com.minyase.app


      vars:

        XCODE_WORKSPACE: "ios/App/App.xcworkspace"

        XCODE_SCHEME: "App"

        APP_STORE_APPLE_ID: 6808256800


    scripts:


      - name: 依存の取得

        script: |

          set -e

          npm install


      - name: 配信するWebファイルを www に集める

        script: |

          set -e

          npm run build

          echo "===== www contents ====="

          ls -la www


      - name: iOSプロジェクトを用意する

        script: |

          set -e

          if [ ! -d "ios" ]; then

            echo "iOS project does not exist. Creating it."

            npx cap add ios

          else

            echo "Existing iOS project found."

          fi


      - name: App icon と Splash を生成する

        script: |

          set -e

          if [ ! -f "resources/icon.png" ]; then

            echo "ERROR: resources/icon.png がありません"

            exit 1

          fi

          echo "Generating iOS assets..."

          npx @capacitor/assets generate --ios


      - name: WebファイルをiOSへ同期する

        script: |

          set -e

          npx cap sync ios


      - name: iOS Privacy Usage Description を設定する

        script: |

          set -e

          PLIST="ios/App/App/Info.plist"

          if [ ! -f "$PLIST" ]; then

            echo "ERROR: Info.plist が見つかりません"

            exit 1

          fi


          echo "Setting NSPhotoLibraryUsageDescription..."

          /usr/libexec/PlistBuddy \
            -c "Set :NSPhotoLibraryUsageDescription プロフィール画像を設定するために写真ライブラリを使用します。" \
            "$PLIST" \
          || \
          /usr/libexec/PlistBuddy \
            -c "Add :NSPhotoLibraryUsageDescription string プロフィール画像を設定するために写真ライブラリを使用します。" \
            "$PLIST"


          echo "Setting NSCameraUsageDescription..."

          /usr/libexec/PlistBuddy \
            -c "Set :NSCameraUsageDescription プロフィール画像を撮影するためにカメラを使用します。" \
            "$PLIST" \
          || \
          /usr/libexec/PlistBuddy \
            -c "Add :NSCameraUsageDescription string プロフィール画像を撮影するためにカメラを使用します。" \
            "$PLIST"


          echo "===== Privacy descriptions ====="

          /usr/libexec/PlistBuddy \
            -c "Print :NSPhotoLibraryUsageDescription" \
            "$PLIST"

          /usr/libexec/PlistBuddy \
            -c "Print :NSCameraUsageDescription" \
            "$PLIST"


          echo "===== Info.plist validation ====="

          plutil -lint "$PLIST"


      - name: CocoaPods

        script: |

          set -e

          cd ios/App

          pod install


      - name: 署名設定をXcodeプロジェクトへ適用する

        script: |

          set -e

          xcode-project use-profiles


      - name: ビルド番号を採番する

        script: |

          set -e

          cd "$CM_BUILD_DIR/ios/App"


          LATEST_BUILD_NUMBER=$(

            app-store-connect \
              get-latest-app-store-build-number \
              "$APP_STORE_APPLE_ID" \
            || true

          )


          if [ -z "$LATEST_BUILD_NUMBER" ]; then

            NEXT=$BUILD_NUMBER

          else

            NEXT=$((LATEST_BUILD_NUMBER + 1))

          fi


          echo "Next build number: $NEXT"

          agvtool new-version -all "$NEXT"


      - name: IPAを作る

        script: |

          set -e

          cd "$CM_BUILD_DIR/ios/App"


          xcode-project build-ipa \
            --workspace "$CM_BUILD_DIR/$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"


    artifacts:

      - ios/App/build/ios/ipa/*.ipa

      - /tmp/xcodebuild_logs/*.log

      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app

      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM


    publishing:


      email:

        recipients:

          - jomon@jomonkusama.com


        notify:

          success: true

          failure: true


      app_store_connect:

        auth: integration


        # IPA は App Store Connect へアップロードする。
        # TestFlight Beta Review は自動提出しない。
        submit_to_testflight: false


        # App Store本審査も自動提出しない。
        # 新しいビルドを実機確認後、
        # App Store Connectから手動で選択して提出する。
        submit_to_app_store: false
