# みんやせ / codemagic.yaml
#
# iOS App Store build
#
# Bundle ID: com.minyase.app
# Apple ID: 6808256800
# App Store Version: 1.0.1
# iPhone専用

workflows:

  ios-minyase:

    name: MINYASE iOS

    max_build_duration: 60

    instance_type: mac_mini_m2


    integrations:

      app_store_connect: Codemagic


    environment:

      node: 20

      xcode: latest

      cocoapods: default


      ios_signing:

        distribution_type: app_store

        bundle_identifier: com.minyase.app


      vars:

        XCODE_WORKSPACE: "ios/App/App.xcworkspace"

        XCODE_SCHEME: "App"

        APP_STORE_APPLE_ID: 6808256800

        APP_VERSION: "1.0.1"


    scripts:


      - name: 依存の取得

        script: |

          set -e

          npm install


      - name: 配信するWebファイルを www に集める

        script: |

          set -e

          npm run build

          echo "===== www contents ====="

          ls -la www


      - name: iOSプロジェクトを用意する

        script: |

          set -e

          if [ ! -d "ios" ]; then

            echo "iOS project does not exist. Creating it."

            npx cap add ios

          else

            echo "Existing iOS project found."

          fi


      - name: App icon と Splash を生成する

        script: |

          set -e

          if [ ! -f "resources/icon.png" ]; then

            echo "ERROR: resources/icon.png がありません"

            exit 1

          fi

          echo "Generating iOS assets..."

          npx @capacitor/assets generate --ios


      - name: WebファイルをiOSへ同期する

        script: |

          set -e

          npx cap sync ios


      - name: iPhone専用に設定する

        script: |

          set -e

          PBXPROJ="ios/App/App.xcodeproj/project.pbxproj"

          if [ ! -f "$PBXPROJ" ]; then

            echo "ERROR: Xcode project が見つかりません"

            exit 1

          fi


          echo "===== Current TARGETED_DEVICE_FAMILY ====="

          grep -n "TARGETED_DEVICE_FAMILY" "$PBXPROJ" || true


          python3 <<'PY'

          from pathlib import Path
          import re

          path = Path(
              "ios/App/App.xcodeproj/project.pbxproj"
          )

          text = path.read_text(
              encoding="utf-8"
          )

          pattern = (
              r'TARGETED_DEVICE_FAMILY'
              r'\s*=\s*'
              r'[^;]+;'
          )

          replacement = (
              'TARGETED_DEVICE_FAMILY = 1;'
          )

          new_text, count = re.subn(
              pattern,
              replacement,
              text
          )

          if count == 0:
              raise SystemExit(
                  "ERROR: TARGETED_DEVICE_FAMILY がありません"
              )

          path.write_text(
              new_text,
              encoding="utf-8"
          )

          values = re.findall(
              r'TARGETED_DEVICE_FAMILY'
              r'\s*=\s*'
              r'([^;]+);',
              new_text
          )

          values = [
              v.strip().strip('"')
              for v in values
          ]

          if (
              not values
              or any(v != "1" for v in values)
          ):
              raise SystemExit(
                  "ERROR: iPhone専用設定に失敗: "
                  + repr(values)
              )

          print(
              "TARGETED_DEVICE_FAMILY verified: "
              + repr(values)
          )

          PY


          ACTUAL=$(

            xcodebuild \
              -project ios/App/App.xcodeproj \
              -target App \
              -configuration Release \
              -showBuildSettings \
              2>/dev/null \
            | awk \
              -F ' = ' \
              '/TARGETED_DEVICE_FAMILY/ {
                print $2;
                exit
              }'

          )


          echo "TARGETED_DEVICE_FAMILY=$ACTUAL"


          if [ "$ACTUAL" != "1" ]; then

            echo "ERROR: Release build がiPhone専用ではありません"

            exit 1

          fi


          echo "OK: iPhone only"


      - name: iOS Privacy Usage Description を設定する

        script: |

          set -e

          PLIST="ios/App/App/Info.plist"

          if [ ! -f "$PLIST" ]; then

            echo "ERROR: Info.plist が見つかりません"

            exit 1

          fi


          /usr/libexec/PlistBuddy \
            -c "Set :NSPhotoLibraryUsageDescription プロフィール画像を設定するために写真ライブラリを使用します。" \
            "$PLIST" \
          || \
          /usr/libexec/PlistBuddy \
            -c "Add :NSPhotoLibraryUsageDescription string プロフィール画像を設定するために写真ライブラリを使用します。" \
            "$PLIST"


          /usr/libexec/PlistBuddy \
            -c "Set :NSCameraUsageDescription プロフィール画像を撮影するためにカメラを使用します。" \
            "$PLIST" \
          || \
          /usr/libexec/PlistBuddy \
            -c "Add :NSCameraUsageDescription string プロフィール画像を撮影するためにカメラを使用します。" \
            "$PLIST"


          echo "===== Info.plist validation ====="

          plutil -lint "$PLIST"


      - name: CocoaPods

        script: |

          set -e

          cd ios/App

          pod install


      - name: 署名設定をXcodeプロジェクトへ適用する

        script: |

          set -e

          xcode-project use-profiles


      - name: バージョンとビルド番号を設定する

        script: |

          set -e

          cd "$CM_BUILD_DIR/ios/App"

          PLIST="App/Info.plist"


          echo "===== App Version ====="

          echo "Setting App Store version to $APP_VERSION"


          agvtool new-marketing-version "$APP_VERSION"


          ACTUAL_VERSION=$(
            /usr/libexec/PlistBuddy \
              -c "Print :CFBundleShortVersionString" \
              "$PLIST"
          )


          echo "CFBundleShortVersionString=$ACTUAL_VERSION"


          if [ "$ACTUAL_VERSION" != "$APP_VERSION" ]; then

            echo "ERROR: App Version が $APP_VERSION になっていません"

            exit 1

          fi


          echo "OK: App Version $APP_VERSION"


          echo "===== Build Number ====="


          LATEST_BUILD_NUMBER=$(

            app-store-connect \
              get-latest-app-store-build-number \
              "$APP_STORE_APPLE_ID" \
            || true

          )


          echo "Latest App Store build number: ${LATEST_BUILD_NUMBER:-not-found}"


          if [ -z "$LATEST_BUILD_NUMBER" ]; then

            NEXT=$BUILD_NUMBER

          else

            NEXT=$((LATEST_BUILD_NUMBER + 1))

          fi


          echo "Next build number: $NEXT"


          agvtool new-version -all "$NEXT"


          ACTUAL_BUILD=$(
            /usr/libexec/PlistBuddy \
              -c "Print :CFBundleVersion" \
              "$PLIST"
          )


          echo "CFBundleVersion=$ACTUAL_BUILD"


          if [ "$ACTUAL_BUILD" != "$NEXT" ]; then

            echo "ERROR: Build Number の設定に失敗しました"

            exit 1

          fi


          echo "OK: Version $APP_VERSION ($NEXT)"


      - name: IPAを作る

        script: |

          set -e

          cd "$CM_BUILD_DIR/ios/App"


          echo "Building みんやせ $APP_VERSION..."


          xcode-project build-ipa \
            --workspace "$CM_BUILD_DIR/$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"


    artifacts:

      - ios/App/build/ios/ipa/*.ipa

      - /tmp/xcodebuild_logs/*.log

      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app

      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM


    publishing:


      email:

        recipients:

          - jomon@jomonkusama.com


        notify:

          success: true

          failure: true


      app_store_connect:

        auth: integration


        submit_to_testflight: false

        submit_to_app_store: false
